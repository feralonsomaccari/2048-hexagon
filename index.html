    <noscript>
      <h1>2048 Hexagon</h1>
      <p>
        2048 Hexagon is a free, browser-based puzzle game — a hexagonal twist on the classic 2048.
        Slide and merge numbered tiles on a hex grid using Q, W, E, A, S, D or the arrow keys.
        When two tiles with the same number touch, they merge into one. Keep merging until you reach 2048.
      </p>
      <p>You need to enable JavaScript to play.</p>
